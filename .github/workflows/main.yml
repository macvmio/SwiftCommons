name: Main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DEVELOPER_DIR: "/Applications/Xcode_26.3.app/Contents/Developer"
  GITHUB_API_TOKEN: ${{ github.token }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - name: Run setup
      run: make setup
    - name: Remove quarantine from mise tools
      run: find "$HOME/.local/share/mise" -type f -perm +111 -exec xattr -d com.apple.quarantine {} + 2>/dev/null || true
    - name: Run lint
      run: make lint

  build:
    name: Build
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    - name: Run setup
      run: make setup
    - name: Run build
      run: make build

  test:
    name: Test
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    - name: Run setup
      run: make setup
    - name: Run tests
      run: make test
